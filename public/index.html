<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f1">
  <meta name="robots" content="noindex, nofollow">
  <title>Visto</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Visto</div>
    <button class="link-btn" id="logout">Sair</button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" hidden></nav>

  <dialog id="photo-dialog" class="photo-dialog">
    <img id="photo-dialog-img" alt="Fotografia do caderno">
    <form method="dialog"><button class="btn">Fechar</button></form>
  </dialog>

  <noscript>Esta aplicação precisa de JavaScript.</noscript>
</body>
</html>
